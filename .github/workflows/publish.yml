# Releases this package on every push to main that changes what it ships: bumps the patch
# version, updates CHANGELOG.md, commits "Release x.y.z", tags it, creates the GitHub release and
# publishes to npm with provenance. For a minor or a major version, run it by hand instead
# (Actions > Publish > Run workflow) and choose the increment.
#
# One job does it all: a commit or tag pushed with GITHUB_TOKEN starts no workflow, so a second
# workflow on the tag would never run. For the same reason the release commit starts no new run.
#
# npm trusts this workflow by its file name (Trusted Publishing, OIDC; no NPM_TOKEN): renaming
# publish.yml stops publishing until the package's Trusted Publisher on npmjs.com is updated.

name: Publish

on:
  push:
    branches: [main]
    # What the npm package holds (dist, built from nodes and credentials) and shows (README.md).
    paths:
      - 'nodes/**'
      - 'credentials/**'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
  workflow_dispatch:
    inputs:
      increment:
        description: 'Version increment'
        type: choice
        options: [patch, minor, major]
        default: patch

# One release at a time, in order: two at once would bump the same version.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Release and publish to npm
    runs-on: ubuntu-latest

    permissions:
      # The OIDC token npm exchanges for publishing and signs the provenance with.
      id-token: write
      # The release commit, its tag and the GitHub release.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # main as it is now, not the commit that queued this run: a queued run releases what a
          # run before it did not.
          ref: main
          # release-it and auto-changelog read every commit since the last tag.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      # Lint and build come first: a failure stops the run before anything is pushed. With no
      # commit since the last release, release-it stops without failing and pushes nothing.
      - name: Bump, changelog, commit, tag and GitHub release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npx release-it "$INCREMENT" --ci \
            --git.requireBranch=main \
            --git.requireCommitsFail=false \
            --git.changelog='npx auto-changelog --stdout --unreleased --commit-limit false -u --hide-credit' \
            --hooks.before:init='npm run lint && npm run build' \
            --hooks.after:bump='npx auto-changelog -p' \
            --github.release \
            --npm.publish=false
        env:
          INCREMENT: ${{ inputs.increment || 'patch' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishes the version package.json holds unless npm has it already: nothing to do after a
      # run that released nothing, and a run again after a failed publish only publishes.
      - name: Publish to npm
        run: |
          version="$(node -p 'const p = require("./package.json"); `${p.name}@${p.version}`')"
          if [ -n "$(npm view "$version" version 2>/dev/null)" ]; then
            echo "$version is on npm already."
          else
            npm run build
            npm publish --provenance
          fi
        env:
          # n8n-node's prepublishOnly refuses a publish without it.
          RELEASE_MODE: 'true'
